[package]
name = "bellmux"
version = "0.1.2"
rust-version = "1.89"
edition = "2021"
description = "Minimal notification layer bridging Claude Code hooks, tmux, and SQLite."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Daiius/bellmux"
readme = "README.md"

[[bin]]
name = "bellmux"
path = "src/main.rs"

[dependencies]
rusqlite   = { version = "0.43", features = ["bundled"] }
clap       = { version = "4", features = ["derive"] }
serde_json = "1"
jiff       = { version = "1", default-features = false, features = ["std"] }
anyhow     = "1"
dirs       = "7"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
